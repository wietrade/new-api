name: sync-model-metadata

on:
  schedule:
    # daily at 02:17 UTC
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      allow_new:
        description: 'Also create newly released models'
        type: boolean
        default: false
      min_release_date:
        description: 'With allow_new: ignore models released before this date (YYYY-MM-DD)'
        type: string
        default: ''
      direct_commit:
        description: 'Commit straight to the default branch instead of opening a PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-model-metadata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests
        run: python -m unittest discover -s scripts/model_sync/tests -t . -v

      - name: Sync metadata and prices
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          flags=""
          if [ "${{ inputs.allow_new }}" = "true" ]; then
            flags="--allow-new"
            if [ -n "${{ inputs.min_release_date }}" ]; then
              flags="$flags --min-release-date ${{ inputs.min_release_date }}"
            fi
          fi
          python scripts/model_sync/sync_models.py --only metadata --official $flags
          python scripts/model_sync/sync_models.py --only pricing

      - name: Detect changes
        id: diff
        run: |
          # git diff misses newly created files (pricing.json on first run)
          if [ -z "$(git status --porcelain -- metadata)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager status --short -- metadata
            git --no-pager diff --stat -- metadata
          fi

      - name: Commit directly
        if: steps.diff.outputs.changed == 'true' && inputs.direct_commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata
          git commit -m "chore(metadata): sync official model metadata and prices"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true' && !inputs.direct_commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="chore/model-metadata-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add metadata
          git commit -m "chore(metadata): sync official model metadata and prices"
          git push --force origin "$branch"

          cat > /tmp/pr-body.md <<'BODY'
          自动同步（厂商 API / models.dev / OpenRouter，配置见 metadata/api/newapi/sync.config.json）。

          请 review：
          - metadata/api/newapi/models.json：上下文、最大输出、模态、能力的刷新；新增模型需确认后再合并。
          - metadata/api/newapi/pricing.json：价格为参考价快照（聚合源，非厂商官方牌价），合并本 PR 不会自动改价。

          合并后到后台「同步资料」预览并应用，才会写入模型库。
          BODY

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "chore(metadata): sync official model metadata and prices" \
              --body-file /tmp/pr-body.md
          else
            echo "PR already open, branch updated."
          fi
